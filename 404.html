<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="designer" content="Eternal" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Glen Villa Juniors FC</title>
  <link rel="icon" type="image/png" href="images/logo.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,400;0,600;0,700;1,400&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    .error-page {
      min-height: 100vh;
      background: var(--maroon-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 2rem;
      position: relative;
      overflow: hidden;
    }
    .error-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -55deg, transparent, transparent 40px,
        rgba(110,198,230,0.03) 40px, rgba(110,198,230,0.03) 80px
      );
    }
    .error-content { position: relative; z-index: 1; max-width: 520px; }
    .error-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 2rem;
      opacity: 0.85;
    }
    .error-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 20vw, 10rem);
      letter-spacing: 0.05em;
      color: var(--blue);
      line-height: 1;
      margin-bottom: 0;
    }
    .error-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      letter-spacing: 0.05em;
      color: #fff;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .error-body {
      color: rgba(255,255,255,0.65);
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="error-page">
    <div class="error-content">
      <img src="images/logo.png" alt="Glen Villa Juniors FC" class="error-logo" />
      <div class="error-code">404</div>
      <h1 class="error-title">That Page Doesn't Exist</h1>
      <p class="error-body">
        Looks like you've gone out of bounds. The page you're looking for
        may have moved or never existed — but the club definitely does.
      </p>
      <div class="error-links">
        <a href="index.html" class="btn btn-blue">Back to Home</a>
        <a href="teams.html" class="btn btn-ghost">Our Teams</a>
        <a href="contact.html" class="btn btn-ghost">Contact Us</a>
      </div>
    </div>
  </div>

</body>
</html>
